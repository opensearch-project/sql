root:
  children:
    - children:
        - children:
            - children:
                - children: []
                  description:
                    request: "OpenSearchQueryRequest(indexName=opensearch-sql_test_index_account,\
                      \ sourceBuilder={\"from\":0,\"size\":0,\"timeout\":\"1m\",\"\
                      query\":{\"range\":{\"age\":{\"from\":30,\"to\":null,\"include_lower\"\
                      :false,\"include_upper\":true,\"boost\":1.0}}},\"aggregations\"\
                      :{\"composite_buckets\":{\"composite\":{\"size\":1000,\"sources\"\
                      :[{\"state\":{\"terms\":{\"field\":\"state.keyword\",\"missing_bucket\"\
                      :true,\"missing_order\":\"first\",\"order\":\"asc\"}}},{\"city\"\
                      :{\"terms\":{\"field\":\"city.keyword\",\"missing_bucket\":true,\"\
                      missing_order\":\"first\",\"order\":\"asc\"}}}]},\"aggregations\"\
                      :{\"avg_age\":{\"avg\":{\"field\":\"age\"}}}}}}, pitId=*,\
                      \ cursorKeepAlive=null, searchAfter=null, searchResponse=null)"
                  name: OpenSearchIndexScan
              description:
                removeList: "[city]"
              name: RemoveOperator
          description:
            expressions:
              age2: "+(avg_age, 2)"
          name: OpenSearchEvalOperator
      description:
        dedupeList: "[age2]"
        allowedDuplication: 1
        keepEmpty: false
        consecutive: false
      name: DedupeOperator
  description:
    fields: "[age2]"
  name: ProjectOperator