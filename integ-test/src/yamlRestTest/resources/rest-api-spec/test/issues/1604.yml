# Issue: https://github.com/opensearch-project/sql/issues/1604
#        https://github.com/opensearch-project/sql/issues/3067
# A flat_object field used to be dropped by OpenSearchDataType.parseMapping ("unknown type, skip
# it"), so it was absent from the schema and any reference failed as "field not found".
#
# The field is now a struct keyed by the dotted path of each leaf. A leaf has no type of its own in
# the index, so every value reads as text and a path holding several values reads as their JSON --
# the same rule spath applies to a JSON string.
setup:
  - do:
      indices.create:
        index: otel
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
          mappings:
            properties:
              service:
                type: keyword
              attributes:
                type: flat_object

  - do:
      bulk:
        refresh: true
        body:
          - '{"index": {"_index": "otel", "_id": "1"}}'
          - '{"service": "checkout", "attributes": {"http.response.status_code": 500, "duration_ms": 12.5, "ok": true}}'
          - '{"index": {"_index": "otel", "_id": "2"}}'
          - '{"service": "payments", "attributes": {"http": {"response": {"status_code": 503}}, "duration_ms": "4"}}'
          - '{"index": {"_index": "otel", "_id": "3"}}'
          - '{"service": "tags", "attributes": {"tags": ["a", "b"], "mixed": [1, "x"], "nested": [{"k": 1}, {"k": 2}]}}'
          - '{"index": {"_index": "otel", "_id": "4"}}'
          - '{"service": "collide", "attributes": {"a": {"b": 1}, "a.b": 2}}'

  - do:
      indices.create:
        index: otel_nested
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
          mappings:
            properties:
              service:
                type: keyword
              projects:
                type: nested
                properties:
                  kw:
                    type: keyword
                  attributes:
                    type: flat_object

  - do:
      bulk:
        refresh: true
        body:
          - '{"index": {"_index": "otel_nested", "_id": "1"}}'
          - '{"service": "checkout", "projects": [{"kw": "v", "attributes": {"k": "v"}}]}'

  - do:
      query.settings:
        body:
          transient:
            plugins.calcite.enabled: true
            plugins.calcite.fallback.allowed: false

---
teardown:
  - do:
      indices.delete:
        index: otel,otel_nested
        ignore_unavailable: true
  - do:
      query.settings:
        body:
          transient:
            plugins.calcite.enabled: null
            plugins.calcite.fallback.allowed: null
            plugins.calcite.pushdown.enabled: null

---
"describe lists the field as flat_object":
  - skip:
      features: [headers]
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'describe otel | fields COLUMN_NAME, TYPE_NAME'
  - match: {"datarows": [["attributes", "flat_object"], ["service", "string"]]}

---
"the whole field reads as a map of dotted leaf path to text":
  - skip:
      features: [headers]
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=otel | where service = ''checkout'' | fields attributes'
  # every value is text, and the dotted path is the key -- both spellings of a path reach the same one
  - match: {"datarows": [[{"http.response.status_code": "500", "duration_ms": "12.5", "ok": "true"}]]}

---
"a leaf reads as text, under either spelling of its path":
  - skip:
      features: [headers]
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=otel | fields service, attributes.http.response.status_code, attributes.duration_ms | sort service'
  - match: {"datarows": [["checkout", "500", "12.5"], ["collide", null, null], ["payments", "503", "4"], ["tags", null, null]]}

---
"a path holding several values reads as their JSON":
  - skip:
      features: [headers]
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=otel | where service = ''tags'' | fields attributes.tags, attributes.mixed, attributes.nested.k'
  - match: {"datarows": [["[\"a\",\"b\"]", "[\"1\",\"x\"]", "[\"1\",\"2\"]"]]}
  # both spellings of a path in one document: neither value is dropped
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=otel | where service = ''collide'' | fields attributes.a.b'
  - match: {"datarows": [["[\"1\",\"2\"]"]]}

---
# The reading of several values is the JSON of all of them, which is no one value and so no term the
# index holds. Folding it would find nothing while a comparison made after reading finds the record,
# so the predicate is left to the path that produces the text and both plans answer alike.
"a predicate against the whole reading of several values answers the same either way":
  - skip:
      features: [headers]
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=otel | where attributes.tags = ''["a","b"]'' | fields service'
  - match: {"datarows": [["tags"]]}
  - do:
      query.settings:
        body:
          transient:
            plugins.calcite.pushdown.enabled: false
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=otel | where attributes.tags = ''["a","b"]'' | fields service'
  - match: {"datarows": [["tags"]]}
  - do:
      query.settings:
        body:
          transient:
            plugins.calcite.pushdown.enabled: null

---
"a leaf can be cast, and typeof reports text":
  - skip:
      features: [headers]
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=otel | where service = ''payments'' | eval n = cast(attributes.duration_ms as double), t = typeof(attributes.duration_ms) | fields n, t'
  - match: {"datarows": [[4.0, "STRING"]]}

---
# A leaf is text, so PPL does with it what it does with any text column -- the same as a field
# spath extracted from a JSON string.
"a leaf can be filtered, sorted and aggregated like any text column":
  - skip:
      features: [headers]
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=otel | where attributes.duration_ms = ''4'' | fields service'
  - match: {"datarows": [["payments"]]}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=otel | where attributes.duration_ms > 5 | fields service'
  - match: {"datarows": [["checkout"]]}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=otel | stats avg(attributes.duration_ms)'
  - match: {"datarows": [[8.25]]}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=otel | where isnotnull(attributes.duration_ms) | sort attributes.duration_ms | fields attributes.duration_ms'
  - match: {"datarows": [["12.5"], ["4"]]}

---
# A leaf is one keyword term with the path folded in, so an exact-match predicate is answered by the
# index. Written with no spaces: MatchAssertion compiles these with Pattern.COMMENTS, which discards
# unescaped whitespace.
"an exact-match predicate on a leaf reaches the index, not a script":
  - skip:
      features: [headers]
  - do:
      headers: {Content-Type: 'application/json'}
      ppl.explain:
        body:
          query: "source=otel | where attributes.duration_ms = '4' | fields service"
  - match: {"calcite.physical": "/\"term\":\\{\"attributes.duration_ms\"/"}
  - match: {"calcite.physical": "/^((?!opensearch_compounded_script).)*$/"}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl.explain:
        body:
          query: "source=otel | where attributes.duration_ms in ('4','12.5') | fields service"
  - match: {"calcite.physical": "/\"terms\":\\{\"attributes.duration_ms\"/"}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl.explain:
        body:
          query: "source=otel | where isnotnull(attributes.duration_ms) | fields service"
  - match: {"calcite.physical": "/\"exists\":\\{\"field\":\"attributes.duration_ms\"/"}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl.explain:
        body:
          query: "source=otel | where like(attributes.duration_ms, '1%') | fields service"
  - match: {"calcite.physical": "/\"wildcard\":\\{\"attributes.duration_ms\"/"}

---
# A nested field is indexed as hidden child documents, so a term naming a leaf under one is filed on
# the child and not on the root a search returns. Unwrapped it matches nothing and nothing is
# raised -- the row disappears -- so the leaf carries its nested path like every mapped field does,
# and the keyword sibling below shows the shape it has to have.
"a leaf under a nested field is reached through a nested query":
  - skip:
      features: [headers]
  - do:
      headers: {Content-Type: 'application/json'}
      ppl.explain:
        body:
          query: "source=otel_nested | where projects.attributes.k = 'v' | fields service"
  - match: {"calcite.physical": "/\"nested\":\\{\"query\":\\{\"term\":\\{\"projects.attributes.k\"/"}
  - match: {"calcite.physical": "/\"path\":\"projects\"/"}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: "source=otel_nested | where projects.attributes.k = 'v' | fields service"
  - match: {"datarows": [["checkout"]]}
  - do:
      query.settings:
        body:
          transient:
            plugins.calcite.pushdown.enabled: false
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: "source=otel_nested | where projects.attributes.k = 'v' | fields service"
  - match: {"datarows": [["checkout"]]}
  - do:
      query.settings:
        body:
          transient:
            plugins.calcite.pushdown.enabled: null

---
# The other side of the table in the docs: what the index cannot answer is planned as a script that
# reads the leaf out of _source per record. Asserted so that a change which silently turns one of
# these into a term query -- comparing text where the query asked for a number -- is caught.
"what the index cannot answer is planned as a script":
  - skip:
      features: [headers]
  - do:
      headers: {Content-Type: 'application/json'}
      ppl.explain:
        body:
          query: "source=otel | where cast(attributes.duration_ms as double) > 5 | fields service"
  - match: {"calcite.physical": "/opensearch_compounded_script/"}
  - match: {"calcite.physical": "/^((?!\"range\":).)*$/"}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl.explain:
        body:
          query: "source=otel | where attributes.tags = '[\"a\",\"b\"]' | fields service"
  - match: {"calcite.physical": "/^((?!\"term\":\\{\"attributes.tags\").)*$/"}

---
# A flat_object can be a sub-field of an ordinary object, which the field type's documentation shows
# as its second example. The leaf is then named by the whole path, and the index term carries all of
# it, so the lookup is the same one.
"a flat_object can be a sub-field of an object":
  - skip:
      features: [headers]
  - do:
      indices.create:
        index: sub
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
          mappings:
            properties:
              issue:
                properties:
                  number:
                    type: double
                  labels:
                    type: flat_object
  - do:
      index:
        index: sub
        id: 1
        refresh: true
        body: {"issue": {"number": 123456, "labels": {"version": "2.1", "backport": ["2.0", "1.3"], "category": {"type": "API", "level": "enhancement"}}}}
  # the sibling keeps its own mapping; only labels is flat
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'describe sub | fields COLUMN_NAME, TYPE_NAME'
  - match: {"datarows": [["issue", "struct"], ["issue.labels", "flat_object"], ["issue.number", "double"]]}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=sub | fields issue.labels.category.level, issue.labels.backport, issue.number'
  - match: {"datarows": [["enhancement", "[\"2.0\",\"1.3\"]", 123456.0]]}
  # the term the index holds carries the whole path, so the lookup is a term like any other
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=sub | where issue.labels.category.level = ''enhancement'' | fields issue.number'
  - match: {"datarows": [[123456.0]]}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl.explain:
        body:
          query: "source=sub | where issue.labels.category.level = 'enhancement' | fields issue.number"
  - match: {"calcite.physical": "/\"term\":\\{\"issue.labels.category.level\"/"}
  - do:
      indices.delete:
        index: sub

---
# An alias to a flat_object resolves to the target before the predicate is folded, so the leaf is
# looked up under the target's path. Reading the type map alone suggests an alias slips past the
# flat_object check -- the map holds OpenSearchAliasType under the alias key -- but it does not,
# because the name is already the target's by then. Same as the binary case in issues/5757.
"an alias to a flat_object is looked up under the target":
  - skip:
      features: [headers]
  - do:
      indices.create:
        index: aliased
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
          mappings:
            properties:
              service:
                type: keyword
              attributes:
                type: flat_object
              attrs:
                type: alias
                path: attributes
  - do:
      index:
        index: aliased
        id: 1
        refresh: true
        body: {"service": "payments", "attributes": {"duration_ms": "4"}}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=aliased | fields attrs.duration_ms'
  - match: {"datarows": [["4"]]}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=aliased | where attrs.duration_ms = ''4'' | fields service'
  - match: {"datarows": [["payments"]]}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl.explain:
        body:
          query: "source=aliased | where attrs.duration_ms = '4' | fields service"
  - match: {"calcite.physical": "/\"term\":\\{\"attributes.duration_ms\"/"}
  - do:
      indices.delete:
        index: aliased

---
# A predicate the index cannot answer is evaluated after the records are read, by a script that
# reads the field out of _source. _source holds the document as written, so the script is given the
# same flattened map the engine presents -- without it a leaf is not found under its dotted path,
# and an array at the root is not a map at all.
"a script over a leaf is given the flattened field":
  - skip:
      features: [headers]
  - do:
      indices.create:
        index: scripted
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
          mappings:
            properties:
              service:
                type: keyword
              attributes:
                type: flat_object
  - do:
      bulk:
        refresh: true
        body:
          - '{"index": {"_index": "scripted", "_id": "1"}}'
          - '{"service": "nested", "attributes": {"http": {"response": {"status_code": 503}}}}'
          - '{"index": {"_index": "scripted", "_id": "2"}}'
          - '{"service": "low", "attributes": {"http.response.status_code": 200}}'
          - '{"index": {"_index": "scripted", "_id": "3"}}'
          - '{"service": "rooted", "attributes": [{"a": 1}, {"a": 2}]}'
  # a leaf reached through a nested object, compared by value rather than by term
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=scripted | where attributes.http.response.status_code > 500 | fields service'
  - match: {"datarows": [["nested"]]}
  # the record with an array at the root is in the same index, and the script runs over it without
  # failing -- it is a map by the time the script sees it. Its own leaf holds both values, so it is
  # not a number any more
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=scripted | where service = ''rooted'' | fields attributes.a'
  - match: {"datarows": [["[\"1\",\"2\"]"]]}
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=scripted | where cast(attributes.http.response.status_code as double) >= 200 | sort service | fields service'
  - match: {"datarows": [["low"], ["nested"]]}
  - do:
      indices.delete:
        index: scripted

---
# A number is matched by value through a cast, whatever form the record wrote it in. The other half
# of this -- that text equality matches the token as written, so `= '1e3'` finds a record that wrote
# 1e3 while the leaf reads as "1000.0" -- cannot be covered here: this client normalises a numeric
# token before indexing, so the index never holds the exponent form. It is in the documentation.
"a number is matched by value through a cast":
  - skip:
      features: [headers]
  - do:
      indices.create:
        index: numeric
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
          mappings:
            properties:
              service:
                type: keyword
              attributes:
                type: flat_object
  - do:
      bulk:
        refresh: true
        body:
          - '{"index": {"_index": "numeric", "_id": "1"}}'
          - '{"service": "whole", "attributes": {"n": 1000}}'
          - '{"index": {"_index": "numeric", "_id": "2"}}'
          - '{"service": "text", "attributes": {"n": "1000"}}'
  - do:
      headers: {Content-Type: 'application/json'}
      ppl:
        body:
          query: 'source=numeric | where cast(attributes.n as double) = 1000 | sort service | fields service'
  - match: {"datarows": [["text"], ["whole"]]}
  - do:
      indices.delete:
        index: numeric
