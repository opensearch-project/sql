/*
 * The `rest` command extension SPI.
 *
 * This module is intentionally thin: it declares ONLY the interfaces a plugin implements to
 * contribute read-only `rest` endpoints, plus the JDK-typed row/column/arg value objects those
 * interfaces exchange. It depends on the OpenSearch core artifact ONLY (for the transport client
 * handed to a handler) and on NO sql module, so external plugins can compileOnly it without a
 * dependency cycle and without a cross-classloader type-identity problem (row values are plain
 * java.lang types).
 */

plugins {
    id 'java-library'
    id "io.freefair.lombok"
    id 'com.diffplug.spotless'
}

dependencies {
    // Core only. Deliberately no `project(':core')` / `project(':opensearch')` dependency so the
    // sql plugin (which depends on this module) never forms a cycle, and so an external plugin can
    // depend on this module alone.
    compileOnly group: 'org.opensearch', name: 'opensearch', version: "${opensearch_version}"

    testImplementation group: 'org.opensearch', name: 'opensearch', version: "${opensearch_version}"
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.9.3')
    testImplementation('org.junit.jupiter:junit-jupiter-params:5.9.3')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**', '**/build-*/**'
        }
        importOrder()
        licenseHeader("/*\n" +
                " * Copyright OpenSearch Contributors\n" +
                " * SPDX-License-Identifier: Apache-2.0\n" +
                " */\n\n")
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        googleJavaFormat('1.32.0').reflowLongStrings().groupArtifact('com.google.googlejavaformat:google-java-format')
    }
}
