"Empty SQL query returns 400 empty query error":
  - skip:
      features:
        - headers
  # Before the fix the empty statement built a null AST and failed with an internal
  # NullPointerException. catch: bad_request asserts the HTTP status code is exactly 400.
  # The query is now rejected as empty, and it does not fall back to the legacy engine.
  - do:
      catch: bad_request
      headers:
        Content-Type: 'application/json'
      sql:
        body:
          query: ""
  - match: { "$body": "/IllegalArgumentException/" }
  - match: { "$body": "/Query\\s+is\\s+empty/" }
  - match: { "$body": "/^(?s)(?!.*NullPointerException)/" }

---
"Comment and semicolon only SQL query returns 400 empty query error":
  - skip:
      features:
        - headers
  - do:
      catch: bad_request
      headers:
        Content-Type: 'application/json'
      sql:
        body:
          query: "  /* nothing here */ ;  "
  - match: { "$body": "/IllegalArgumentException/" }
  - match: { "$body": "/Query\\s+is\\s+empty/" }
  - match: { "$body": "/^(?s)(?!.*NullPointerException)/" }

---
"Empty SQL explain returns 400 empty query error":
  - skip:
      features:
        - headers
  - do:
      catch: bad_request
      headers:
        Content-Type: 'application/json'
      sql.explain:
        body:
          query: ""
  - match: { "$body": "/IllegalArgumentException/" }
  - match: { "$body": "/Query\\s+is\\s+empty/" }
  - match: { "$body": "/^(?s)(?!.*NullPointerException)/" }
