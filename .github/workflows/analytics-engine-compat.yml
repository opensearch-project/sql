name: Analytics Engine ITs

on:
  pull_request:
  push:
    branches-ignore:
      - 'backport/**'
      - 'dependabot/**'
    paths:
      - '**/*.java'
      - '**gradle*'
      - 'integ-test/**'
      - '.github/workflows/analytics-engine-compat.yml'
  merge_group:

jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@761e093b8c1349cc07f21c1d681d3b30bf9e1999 # main
    with:
      product: opensearch

  analytics-engine-compat:
    needs: Get-CI-Image-Tag
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}

    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Compute native-lib cache week
        id: nativecache
        run: echo "week=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache feature-datafusion dist tarball (native lib source)
        # The dist tarball (~900MB) is the only published artifact carrying
        # lib/rust/libopensearch_native.so, which the AE testClusters need at node boot.
        # downloadNativeLib reuses build/tmp/opensearch-*.tar.gz if present, so caching it
        # avoids re-downloading on every run. Keyed weekly since the feature-build is a
        # rolling "latest" and the .so must stay reasonably fresh vs the plugin zips.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: integ-test/build/tmp/opensearch-*-linux-x64.tar.gz
          key: ae-native-dist-${{ runner.os }}-${{ steps.nativecache.outputs.week }}
          restore-keys: |
            ae-native-dist-${{ runner.os }}-

      - name: Run analytics-engine compatibility smoke test
        run: |
          chown -R 1000:1000 `pwd`
          su `id -un 1000` -c "./gradlew :integ-test:analyticsEngineCompatIT"

      - name: Debug resolved OpenSearch base distribution
        if: always()
        run: |
          echo "=== resolved base OpenSearch server jar(s) and their build commit/date ==="
          find "$HOME" /root /home -type f \
            -path "*transforms*/opensearch-*-linux-x64.tar.gz/opensearch-*/lib/opensearch-*.jar" 2>/dev/null \
            | grep -E "opensearch-[0-9]" | grep -viE "cli|core|common|x-content|geo|secure-sm|compress|dataformat|plugin-classloader" \
            | while read -r j; do
                echo "--- $j ---"
                unzip -p "$j" META-INF/MANIFEST.MF 2>/dev/null | grep -E "Change:|Build-Date:" || true
                echo "PreparableOneMerge present: $(unzip -l "$j" 2>/dev/null | grep -c PreparableOneMerge)"
              done
          echo "=== also scan the assembled testcluster distro on disk ==="
          find integ-test/build/testclusters -path "*distro*/lib/opensearch-*.jar" 2>/dev/null \
            | grep -viE "cli|core|common|x-content|geo|secure-sm|compress|dataformat|plugin-classloader" \
            | while read -r j; do
                echo "--- $j ---"
                unzip -p "$j" META-INF/MANIFEST.MF 2>/dev/null | grep -E "Change:|Build-Date:" || true
                echo "PreparableOneMerge present: $(unzip -l "$j" 2>/dev/null | grep -c PreparableOneMerge)"
              done

      - name: Run analytics-engine security IT
        run: |
          su `id -un 1000` -c "./gradlew :integ-test:analyticsEngineSecurityIT"

      - name: Run analytics-engine profile IT
        run: |
          su `id -un 1000` -c "./gradlew :integ-test:analyticsEngineProfileIT"

      - name: Run analytics-engine multi-value IT
        run: |
          su `id -un 1000` -c "./gradlew :integ-test:analyticsEngineMultiValueIT"
