"Empty SQL query returns 400 syntax error":
  - skip:
      features:
        - headers
  # Before the fix the empty statement built a null AST and failed with an internal
  # NullPointerException. catch: bad_request asserts the HTTP status code is exactly 400.
  # The v2 parser now rejects the query with a syntax error, and it does not fall back to the
  # legacy engine.
  - do:
      catch: bad_request
      headers:
        Content-Type: 'application/json'
      sql:
        body:
          query: ""
  - match: { "$body": "/SyntaxCheckException/" }
  - match: { "$body": "/\\[<EOF>\\]\\s+is\\s+not\\s+a\\s+valid\\s+term/" }

---
"Comment and semicolon only SQL query returns 400 syntax error":
  - skip:
      features:
        - headers
  - do:
      catch: bad_request
      headers:
        Content-Type: 'application/json'
      sql:
        body:
          query: "  /* nothing here */ ;  "
  - match: { "$body": "/SyntaxCheckException/" }
  - match: { "$body": "/\\[;\\]\\s+is\\s+not\\s+a\\s+valid\\s+term/" }

---
"Empty SQL explain returns 400 syntax error":
  - skip:
      features:
        - headers
  - do:
      catch: bad_request
      headers:
        Content-Type: 'application/json'
      sql.explain:
        body:
          query: ""
  - match: { "$body": "/SyntaxCheckException/" }
  - match: { "$body": "/\\[<EOF>\\]\\s+is\\s+not\\s+a\\s+valid\\s+term/" }
