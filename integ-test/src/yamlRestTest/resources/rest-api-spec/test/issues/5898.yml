# Issue: https://github.com/opensearch-project/sql/issues/5898
# mvjoin, and nomv (which rewrites to mvjoin), returned a 500 at execution when the array's elements
# were not strings, because Calcite's ARRAY_JOIN threw while converting them. A known non-string
# element type is now rejected while analyzing, so the client sees a 400.
#
# Date, time and timestamp values are string-backed and stay accepted, as do keyword and text fields,
# mixed arrays such as array('a', n) (widened to strings) and cast(n as string).
setup:
  - do:
      query.settings:
        body:
          transient:
            plugins.calcite.enabled : true
  - do:
      indices.create:
        index: mvjoin_non_string_array_5898
        body:
          mappings:
            properties:
              k:
                type: keyword
              t:
                type: text
              d:
                type: date
              i:
                type: integer
              l:
                type: long
              db:
                type: double
              bo:
                type: boolean
              ip:
                type: ip
              gp:
                type: geo_point
              o:
                properties:
                  a:
                    type: keyword
              ne:
                type: nested
                properties:
                  a:
                    type: keyword
  - do:
      bulk:
        index: mvjoin_non_string_array_5898
        refresh: true
        body:
          - '{"index": {"_id": "1"}}'
          - '{"k": "a", "t": "a", "d": "2024-01-01", "i": 3, "l": 3, "db": 1.5, "bo": true, "ip": "10.0.0.1", "gp": {"lat": 1, "lon": 2}, "o": {"a": "x"}, "ne": [{"a": "x"}]}'

---
teardown:
  - do:
      query.settings:
        body:
          transient:
            plugins.calcite.enabled : false
  - do:
      indices.delete:
        index: mvjoin_non_string_array_5898
        ignore_unavailable: true

---
"mvjoin and nomv on an array of an integer field are rejected while analyzing":
  - skip:
      features:
        - headers
  - do:
      catch: bad_request
      headers:
        Content-Type: 'application/json'
      ppl:
        body:
          query: "source=mvjoin_non_string_array_5898 | eval x = mvjoin(array(i), ',') | fields x"
  - match: { "$body": "/ExpressionEvaluationException/" }
  - match: { "$body": "/analyzing/" }
  - match: { "$body": "/only\\s+supports\\s+string\\s+arrays/" }
  - do:
      catch: bad_request
      headers:
        Content-Type: 'application/json'
      ppl:
        body:
          query: "source=mvjoin_non_string_array_5898 | eval x = array(i) | nomv x | fields x"
  - match: { "$body": "/ExpressionEvaluationException/" }
  - match: { "$body": "/analyzing/" }
  - match: { "$body": "/only\\s+supports\\s+string\\s+arrays/" }

