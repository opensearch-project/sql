codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto    # no lower than the base commit
        threshold: 1%   # integration test coverage can vary a little between runs
    patch:
      default:
        target: 80%

flags:
  unit:
    carryforward: true
  integration:
    carryforward: true
