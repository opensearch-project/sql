# Issue #5987: cast(<boolean> as double) and cast(<boolean> as float) failed with a 500 because the
# generated code could not convert a boolean to a floating point number. They must return 1.0 for
# true and 0.0 for false, matching cast(<boolean> as int), and keep null as null.

setup:
  - do:
      query.settings:
        body:
          transient:
            plugins.calcite.enabled : true
  - do:
      indices.create:
        index: issue5987
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
          mappings:
            properties:
              id:
                type: integer
              b:
                type: boolean
  - do:
      bulk:
        index: issue5987
        refresh: true
        body:
          - '{"index": {}}'
          - '{"id": 1, "b": true}'
          - '{"index": {}}'
          - '{"id": 2, "b": false}'
          - '{"index": {}}'
          - '{"id": 3}'

---
teardown:
  - do:
      query.settings:
        body:
          transient:
            plugins.calcite.enabled : null
  - do:
      indices.delete:
        index: issue5987
        ignore_unavailable: true

---
"Cast boolean to double and float":
  - skip:
      features:
        - headers
  - do:
      headers:
        Content-Type: 'application/json'
      ppl:
        body:
          query: source=issue5987 | sort id | eval i = cast(b as int), d = cast(b as double), f = cast(b as float) | fields id, i, d, f

  - match: { "schema": [ { "name": "id", "type": "int" }, { "name": "i", "type": "int" }, { "name": "d", "type": "double" }, { "name": "f", "type": "float" } ] }
  - match: { "datarows": [ [ 1, 1, 1.0, 1.0 ], [ 2, 0, 0.0, 0.0 ], [ 3, null, null, null ] ] }
