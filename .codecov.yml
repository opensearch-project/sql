codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto      # compare with the base commit
        threshold: 0.5%   # how much a PR may lower the coverage
    patch:
      default:
        target: 75%       # coverage of the lines a PR changes

flags:
  unit:
    carryforward: true
  integration:
    carryforward: true
